layout splits
launch --title "ARCH // CLOCK" python3 @CONFIG_DIR@/clock.py
launch --location=hsplit --bias=80 --title "SYSTEM // CPU + RAM + GPU" btop --config @CONFIG_DIR@/btop.conf
launch --location=hsplit --bias=30 --title "AUDIO // CAVA" cava -p @CONFIG_DIR@/cava.conf
launch --location=vsplit --bias=60 --title "ARCH // IDENTITY" bash @CONFIG_DIR@/info.sh
